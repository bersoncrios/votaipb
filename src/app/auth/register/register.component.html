<form [formGroup]="registerForm" class="auth-main">
  <div class="auth-wrapper version-1">
    <div class="auth-background">
      <div class="yellow-circle"></div>
      <div class="red-circle"></div>
    </div>
    
    <div class="auth-form">
      <div class="main-form">
        <app-card [showHeader]="false" class="auth-form-card">
          <div class="text-center m-b-20">
            <img src="assets/images/logo.png" alt="Vota IPB Logo" style="max-width: 90px; margin-bottom: 10px;" />
            <div>
              <span class="beta-badge" matTooltip="Esta versão (v2.0.0) está em fase BETA. Caso encontre algum bug ou instabilidade, por favor entre em contato conosco!" matTooltipPosition="below">
                <i class="ti ti-bug"></i> v2.0.0 BETA
              </span>
            </div>
          </div>

          <div class="row text-start">
            <div class="col-md-6">
              <label for="firstName" class="f-w-600 f-14 text-dark">Primeiro Nome</label>
              <mat-form-field appearance="outline" class="w-100 m-t-5">
                <input matInput formControlName="firstName" placeholder="Primeiro Nome" />
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <label for="lastName" class="f-w-600 f-14 text-dark">Sobrenome</label>
              <mat-form-field appearance="outline" class="w-100 m-t-5">
                <input matInput formControlName="lastName" placeholder="Sobrenome" />
              </mat-form-field>
            </div>

            <div class="col-12">
              <label for="email" class="f-w-600 f-14 text-dark">Email</label>
              <mat-form-field appearance="outline" class="w-100 m-t-5">
                <input matInput formControlName="email" required placeholder="Digite seu email" />
                <mat-error *ngIf="registerForm.get('email')?.invalid">
                  {{ getErrorMessage() }}
                </mat-error>
              </mat-form-field>
            </div>

            <div class="col-12">
              <label for="password" class="f-w-600 f-14 text-dark">Senha</label>
              <mat-form-field appearance="outline" class="w-100 m-t-5">
                <input matInput [type]="hide ? 'password' : 'text'" formControlName="password"
                  placeholder="Digite sua senha" />
                <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="hide">
                  <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </mat-form-field>
            </div>

            <div class="col-12">
              <label for="confirmPassword" class="f-w-600 f-14 text-dark">Confirmar Senha</label>
              <mat-form-field appearance="outline" class="w-100 m-t-5">
                <input matInput [type]="coHide ? 'password' : 'text'" formControlName="confirmPassword"
                  placeholder="Confirme sua senha" />
                <button type="button" mat-icon-button matSuffix (click)="coHide = !coHide" [attr.aria-label]="'Hide password'"
                  [attr.aria-pressed]="coHide">
                  <mat-icon>{{ coHide ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
              </mat-form-field>
            </div>
          </div>

          <div class="check-me m-t-5">
            <mat-checkbox formControlName="terms" color="primary">
              Concordo com os Termos & Condições
            </mat-checkbox>
          </div>

          <div class="m-t-15">
            <button mat-flat-button class="auth-submit-btn" (click)="register()"
              [disabled]="registerForm.invalid">
              Registrar
            </button>
          </div>

          <div class="text-center m-t-20">
            <span class="f-w-400 text-muted f-14">Já tem uma conta? </span>
            <a class="text-primary-500 f-w-600 f-14" [routerLink]="['/auth/login']">Entrar</a>
          </div>
        </app-card>
      </div>
    </div>
  </div>
</form>
