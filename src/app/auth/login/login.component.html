<form [formGroup]="loginForm" class="auth-main">
  <div class="auth-wrapper version-1">
    <div class="auth-background">
      <div class="yellow-circle"></div>
      <div class="red-circle"></div>
    </div>
    
    <div class="auth-form">
      <div class="main-form">
        <app-card [showHeader]="false" class="auth-form-card">
          <div class="text-center m-b-20">
            <img src="assets/images/logo.png" alt="Vota IPB Logo" style="max-width: 90px; margin-bottom: 10px;" />
            <div>
              <span class="beta-badge" matTooltip="Esta versão (v2.0.0) está em fase BETA. Caso encontre algum bug ou instabilidade, por favor entre em contato conosco!" matTooltipPosition="below">
                <i class="ti ti-bug"></i> v2.0.0 BETA
              </span>
            </div>
          </div>

          <div class="text-start">
            <label for="email" class="f-w-600 f-14 text-dark">Email</label>
            <mat-form-field appearance="outline" class="w-100 m-t-5 m-b-10">
              <input matInput formControlName="email" placeholder="Digite seu email" required />
            </mat-form-field>

            <label for="password" class="f-w-600 f-14 text-dark">Senha</label>
            <mat-form-field appearance="outline" class="w-100 m-t-5 m-b-10">
              <input matInput [type]="hide ? 'password' : 'text'" formControlName="password"
                placeholder="Digite sua senha" />
              <button type="button" mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                [attr.aria-pressed]="hide">
                <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>
          </div>

          <div class="check-me">
            <mat-checkbox color="primary">Lembre-se de mim?</mat-checkbox>
            <a class="f-w-500 f-14 text-primary-500" [routerLink]="['/auth/reset-password']">Esqueceu a senha?</a>
          </div>

          <div class="m-t-15">
            <button mat-flat-button class="auth-submit-btn" (click)="login()"
              [disabled]="loginForm.invalid">
              Entrar
            </button>
          </div>

          <div class="separator">
            <span>ou</span>
          </div>

          <div>
            <button type="button" mat-stroked-button class="google-btn" (click)="loginWithGoogle()">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                <path fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                <path fill="none" d="M0 0h48v48H0z" />
              </svg>
              <span>Entrar com Google</span>
            </button>
          </div>

          <div class="text-center m-t-20">
            <span class="f-w-400 text-muted f-14">Não tem uma conta? </span>
            <a [routerLink]="['/auth/register']" class="text-primary-500 f-w-600 f-14">Registre-se</a>
          </div>

          <div class="text-center m-t-15 p-t-10 style-disclaimer-border">
            <p class="m-0 text-muted f-11" style="line-height: 1.4; opacity: 0.82;">
              <i class="ti ti-info-circle"></i> Projeto pessoal e independente de apoio às igrejas. Sem vínculo institucional oficial com a IPB.
            </p>
          </div>
        </app-card>
      </div>
    </div>
  </div>
</form>
